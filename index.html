<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; }
        canvas { width: 100%; height: 80vh; border: 1px solid #ccc; }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            background: #f5f5f5;
        }
        button, select, input { margin: 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="toolbar">
        <select id="tool">
            <option value="pencil">铅笔</option>
            <option value="circle">圆笔（画圆）</option>
            <option value="pen">钢笔（粗线）</option>
            <option value="sign">签字笔（细线）</option>
            <option value="watercolor">水彩笔（透明色）</option>
            <option value="marker">马克笔（粗色）</option>
            <option value="paint">颜料（填充）</option>
            <option value="highlighter">荧光笔（亮色）</option>
            <option value="shape">图形印刷器（矩形）</option>
        </select>
        <input type="color" id="color" value="#000000">
        <input type="range" id="size" min="1" max="50" value="5" title="画笔大小">
        <button id="eraser">橡皮擦</button>
        <button id="undo">撤销笔画</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let startX, startY;
        let history = [];
        let tool = 'pencil';
        let color = '#000';
        let size = 5;

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.8;
            ctx.lineCap = 'round';
            bindEvents();
        }

        function bindEvents() {
            // 触摸事件
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                isDrawing = true;
                startX = e.touches[0].clientX - canvas.offsetLeft;
                startY = e.touches[0].clientY - canvas.offsetTop;
                history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            });

            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
                const x = e.touches[0].clientX - canvas.offsetLeft;
                const y = e.touches[0].clientY - canvas.offsetTop;
                draw(startX, startY, x, y);
                startX = x;
                startY = y;
            });

            canvas.addEventListener('touchend', () => {
                isDrawing = false;
            });

            // 工具切换
            document.getElementById('tool').addEventListener('change', (e) => {
                tool = e.target.value;
            });

            // 颜色选择
            document.getElementById('color').addEventListener('change', (e) => {
                color = e.target.value;
            });

            // 大小调节
            document.getElementById('size').addEventListener('input', (e) => {
                size = parseInt(e.target.value);
            });

            // 橡皮擦
            document.getElementById('eraser').addEventListener('click', () => {
                color = '#ffffff';
                tool = 'pencil';
            });

            // 撤销
            document.getElementById('undo').addEventListener('click', () => {
                if (history.length > 0) {
                    ctx.putImageData(history.pop(), 0, 0);
                }
            });
        }

        function draw(sx, sy, ex, ey) {
            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = size;

            switch (tool) {
                case 'pencil':
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    break;
                case 'circle':
                    const r = Math.sqrt((ex - sx)**2 + (ey - sy)**2);
                    ctx.arc(sx, sy, r, 0, 2 * Math.PI);
                    ctx.stroke();
                    break;
                case 'pen':
                    ctx.lineWidth = 10;
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    break;
                case 'sign':
                    ctx.lineWidth = 2;
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    break;
                case 'watercolor':
                    ctx.globalAlpha = 0.5;
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    break;
                case 'marker':
                    ctx.lineWidth = 15;
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    break;
                case 'paint':
                    ctx.fillStyle = color;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    break;
                case 'highlighter':
                    ctx.strokeStyle = '#ffff00';
                    ctx.lineWidth = 8;
                    ctx.moveTo(sx, sy);
                    ctx.lineTo(ex, ey);
                    ctx.stroke();
                    break;
                case 'shape':
                    ctx.strokeRect(sx, sy, ex - sx, ey - sy);
                    break;
            }
        }

        window.addEventListener('load', init);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.8;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
